<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sixièmes BMPM</title>
<meta name="description" content="Tableau de bord des effectifs par sixième, avec ajout de personnel et suivi des mouvements mensuels.">
<meta name="theme-color" content="#0d1830">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sixièmes BMPM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f6f7f9;
    --surface:#ffffff;
    --surface-2:#eceff3;
    --border:#c3cad4;
    --text:#12161d;
    --text-dim:#495265;
    --accent:#b3261e;
    --accent-ink:#ffffff;
    --navy:#0d1830;
    --good:#146237;
    --good-bg:#dcf2e3;
    --warn:#8a4b00;
    --warn-bg:#fae3bd;
    --chip-bg:#e7ebf1;
    --chip-border:#b9c2cf;
    --shadow:0 1px 2px rgba(18,22,29,.08), 0 10px 26px -16px rgba(18,22,29,.3);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171512; --surface:#211e1a; --surface-2:#27231e; --border:#3a352c;
      --text:#f1ece1; --text-dim:#a89e8c; --accent:#e2564a; --accent-ink:#1a0a08;
      --navy:#c9d4e8; --good:#7fd39b; --good-bg:#173323; --warn:#f0b45c; --warn-bg:#3a2a0e;
      --chip-bg:#2c2820; --chip-border:#453f33;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171512; --surface:#211e1a; --surface-2:#27231e; --border:#3a352c;
    --text:#f1ece1; --text-dim:#a89e8c; --accent:#e2564a; --accent-ink:#1a0a08;
    --navy:#c9d4e8; --good:#7fd39b; --good-bg:#173323; --warn:#f0b45c; --warn-bg:#3a2a0e;
    --chip-bg:#2c2820; --chip-border:#453f33;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Public Sans', system-ui, sans-serif;
    padding-inline:16px; padding-block:20px;
    padding-top:calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));
  }
  h1,h2,h3{font-family:'Oswald', system-ui, sans-serif; text-transform:uppercase; letter-spacing:.02em; margin:0;}
  .wrap{max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:18px;}

  header.top{
    background:var(--navy); color:#f4f1ea; border-radius:14px; padding:18px 20px;
    display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow);
  }
  header.top .row1{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  header.top h1{font-size:1.5rem; color:inherit;}
  header.top .sub{font-family:'Public Sans'; font-size:.82rem; opacity:.75; margin-top:4px; text-transform:none; letter-spacing:0;}
  .month-field{display:flex; align-items:center; gap:8px; font-size:.8rem; opacity:.9;}
  .month-field input{font:inherit; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3); color:inherit; border-radius:8px; padding:5px 8px;}
  .actions{display:flex; gap:8px; flex-wrap:wrap;}
  button{font-family:inherit; cursor:pointer;}
  .btn{border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08); color:inherit; padding:8px 14px; border-radius:9px; font-size:.85rem; font-weight:600; transition:background .15s;}
  .btn:hover{background:rgba(255,255,255,.18);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn.primary:hover{filter:brightness(1.08);}
  .stats{display:flex; gap:10px; flex-wrap:wrap;}
  .stat{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.22); border-radius:10px; padding:8px 12px; min-width:96px; flex:1 1 96px;}
  .stat .lbl{font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; opacity:.7;}
  .stat .val{font-family:'Oswald'; font-size:1.35rem; font-variant-numeric:tabular-nums; line-height:1.15; display:flex; align-items:baseline; gap:5px;}
  .stat .val small{font-family:'Public Sans'; font-size:.68rem; opacity:.65; font-weight:500;}
  .stat.under .val{color:#ffb199;}
  .stat.ok .val{color:#9be8ad;}

  .board{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:920px){ .board{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .board{grid-template-columns:1fr;} }
  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 14px 10px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;}
  .card .chead{display:flex; align-items:baseline; justify-content:space-between;}
  .card .chead h2{font-size:1.05rem; color:var(--text);}
  .card .chead .total{font-family:'Oswald'; font-variant-numeric:tabular-nums; color:var(--text-dim); font-size:.85rem;}
  .level{border-top:1px solid var(--border); padding-top:8px;}
  .level:first-of-type{border-top:none; padding-top:0;}
  .level .lhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .level .lhead .lname{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); font-weight:600;}
  .level .lhead .lcount{font-size:.72rem; color:var(--text-dim); font-variant-numeric:tabular-nums;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{background:var(--chip-bg); border:1px solid var(--chip-border); border-radius:8px; padding:5px 9px; font-size:.78rem; display:flex; align-items:center; gap:5px; line-height:1.2;}
  .chip button{background:none; border:none; color:var(--text-dim); font-size:.9rem; line-height:1; padding:0 0 0 2px;}
  .chip .grade{color:var(--accent); font-weight:700; font-size:.68rem;}
  .add-slot{border:1px dashed var(--chip-border); border-radius:8px; padding:5px 9px; font-size:.78rem; color:var(--text-dim); background:transparent;}
  .add-slot:hover{color:var(--accent); border-color:var(--accent);}
  .empty-note{color:var(--text-dim); font-size:.78rem; font-style:italic;}

  section.panel{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:var(--shadow);}
  section.panel h2{font-size:1rem; margin-bottom:10px; color:var(--text);}
  .hist-filter{display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}
  .hist-filter select{font:inherit; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 9px; font-size:.82rem;}
  table.hist{width:100%; border-collapse:collapse; font-size:.82rem;}
  table.hist th{text-align:left; color:var(--text-dim); font-weight:600; text-transform:uppercase; font-size:.68rem; letter-spacing:.04em; padding:6px 8px; border-bottom:1px solid var(--border);}
  table.hist td{padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top;}
  .hist-wrap{overflow-x:auto;}
  .tag{display:inline-block; padding:2px 7px; border-radius:100px; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
  .tag.ajout{background:var(--good-bg); color:var(--good);}
  .tag.mutation{background:var(--chip-bg); color:var(--text-dim);}
  .tag.sortie{background:var(--warn-bg); color:var(--warn);}
  .tag.retour{background:var(--good-bg); color:var(--good);}
  .out-list{display:flex; flex-wrap:wrap; gap:6px;}
  .out-chip{background:var(--surface-2); border:1px dashed var(--chip-border); border-radius:8px; padding:5px 9px; font-size:.78rem; color:var(--text-dim); display:flex; gap:6px; align-items:center;}
  .out-chip button{background:none; border:1px solid var(--chip-border); border-radius:6px; color:var(--text); font-size:.7rem; padding:2px 6px;}
  details > summary{cursor:pointer; font-size:.85rem; color:var(--text-dim); font-weight:600; list-style:none;}
  details > summary::-webkit-details-marker{display:none;}
  details > summary:before{content:"▸ "; }
  details[open] > summary:before{content:"▾ "; }
  .overlay{position:fixed; inset:0; background:rgba(10,8,6,.5); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;}
  .modal{background:var(--surface); border-radius:14px; padding:18px; width:100%; max-width:420px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px; max-height:90vh; overflow-y:auto;}
  .modal h3{font-size:1rem;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); font-weight:600;}
  .field select, .field input{font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:4px; flex-wrap:wrap;}
  .btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn.ghost:hover{background:var(--surface-2);}
  .btn.danger{background:var(--warn-bg); border-color:var(--warn-bg); color:var(--warn);}
  .toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:9px 16px; border-radius:100px; font-size:.82rem; box-shadow:var(--shadow); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  .status-line{font-size:.72rem; color:var(--text-dim); text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="row1">
      <div>
        <h1>Sixièmes — Effectifs BMPM</h1>
        <div class="sub">Roulement par niveau, mouvements et intégrations de personnel</div>
      </div>
      <div class="month-field">
        <span>Mois en cours</span>
        <input type="month" id="currentMonth">
      </div>
    </div>
    <div class="stats" id="statsRow"></div>
    <div class="actions">
      <button class="btn primary" id="btnAdd">+ Ajouter du personnel</button>
      <button class="btn" id="btnHistoryToggle">Historique des mouvements</button>
      <button class="btn" id="btnExport">Exporter en CSV</button>
    </div>
  </header>

  <div class="board" id="board"></div>

  <section class="panel">
    <details id="outDetails">
      <summary>Personnel sorti / indisponible (<span id="outCount">0</span>)</summary>
      <div class="out-list" id="outList" style="margin-top:10px;"></div>
    </details>
  </section>

  <section class="panel" id="historyPanel" hidden>
    <h2>Historique des mouvements</h2>
    <div class="hist-filter">
      <label style="font-size:.78rem; color:var(--text-dim);">Filtrer par mois :
        <select id="histFilter"><option value="">Tous</option></select>
      </label>
    </div>
    <div class="hist-wrap">
      <table class="hist">
        <thead><tr><th>Mois</th><th>Type</th><th>Agent</th><th>Détail</th><th>Note</th></tr></thead>
        <tbody id="histBody"></tbody>
      </table>
    </div>
  </section>

  <div class="status-line" id="statusLine"></div>
</div>

<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var GROUPS = [1,2,3,4,5,6];
  var LEVELS = [
    {code:"N4", label:"Niveau 4"},
    {code:"N3", label:"Niveau 3"},
    {code:"N2PL", label:"Niveau 2 PL"},
    {code:"N12", label:"Niveau 1/2"}
  ];
  var GRADES = ["MO","QM","QMB","SM","MT","PM"];
  var DEFAULT_TARGETS = {N4:13, N3:17, N2PL:4, N12:21};

  function levelLabel(code){
    for (var i=0;i<LEVELS.length;i++){ if (LEVELS[i].code===code) return LEVELS[i].label; }
    return code;
  }
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function thisMonthStr(){ var d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
  function monthDisplay(m){
    if (!m) return "—";
    var parts = m.split("-");
    var names = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];
    var idx = parseInt(parts[1],10)-1;
    return (names[idx]||parts[1])+" "+parts[0];
  }
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  var state = { members: [], movements: [], targets: DEFAULT_TARGETS };

  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2600);
  }
  function setStatus(msg){ document.getElementById("statusLine").textContent = msg || ""; }

  // ---------- API ----------
  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
    return fetch("/api/"+path, opts).then(function(res){
      if (!res.ok) throw new Error("HTTP "+res.status);
      return res.status === 204 ? null : res.json();
    });
  }

  function loadMembers(){ return api("members").then(function(d){ state.members = d; renderAll(); }); }
  function loadMovements(){ return api("movements").then(function(d){ state.movements = d; renderHistory(); }); }
  function loadSettings(){ return api("settings").then(function(d){ state.targets = d; renderStats(); }); }
  function refreshAll(){ return Promise.all([loadMembers(), loadMovements(), loadSettings()]); }

  // ---------- rendering ----------
  function computeCounts(){
    var counts = {};
    GROUPS.forEach(function(g){ counts[g] = {}; LEVELS.forEach(function(l){ counts[g][l.code] = 0; }); });
    var totals = {N4:0,N3:0,N2PL:0,N12:0};
    state.members.forEach(function(m){
      if (!m.active) return;
      if (counts[m.group] && counts[m.group][m.level] != null){
        counts[m.group][m.level]++;
        totals[m.level] = (totals[m.level]||0) + 1;
      }
    });
    return {byGroupLevel:counts, totals:totals};
  }

  function renderStats(){
    var c = computeCounts();
    var t = state.targets || DEFAULT_TARGETS;
    var row = document.getElementById("statsRow");
    var grandCur = 0, grandTarget = 0;
    var html = LEVELS.map(function(l){
      var cur = c.totals[l.code]||0;
      var target = t[l.code]!=null ? t[l.code] : 0;
      grandCur += cur; grandTarget += target;
      var cls = cur < target ? "under" : "ok";
      return '<div class="stat '+cls+'"><div class="lbl">'+escapeHtml(l.label)+'</div>' +
        '<div class="val">'+cur+' <small>/ '+target+'</small></div></div>';
    }).join("");
    html += '<div class="stat '+(grandCur<grandTarget?"under":"ok")+'"><div class="lbl">Total</div>' +
      '<div class="val">'+grandCur+' <small>/ '+grandTarget+'</small></div></div>';
    row.innerHTML = html;
  }

  function renderBoard(){
    var c = computeCounts();
    var board = document.getElementById("board");
    var membersByGroup = {};
    GROUPS.forEach(function(g){ membersByGroup[g] = {}; LEVELS.forEach(function(l){ membersByGroup[g][l.code]=[]; }); });
    state.members.forEach(function(m){
      if (!m.active) return;
      if (membersByGroup[m.group] && membersByGroup[m.group][m.level]){
        membersByGroup[m.group][m.level].push(m);
      }
    });

    board.innerHTML = GROUPS.map(function(g){
      var groupTotal = LEVELS.reduce(function(sum,l){ return sum + c.byGroupLevel[g][l.code]; }, 0);
      var levelsHtml = LEVELS.map(function(l){
        var list = membersByGroup[g][l.code].sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); });
        var chips = list.map(function(m){
          return '<span class="chip" data-id="'+m.id+'"><span class="grade">'+escapeHtml(m.grade||"")+'</span>'+escapeHtml(m.name)+
            '<button data-action="open-member" data-id="'+m.id+'" title="Gérer">⋯</button></span>';
        }).join("");
        return '<div class="level">' +
          '<div class="lhead"><span class="lname">'+escapeHtml(l.label)+'</span><span class="lcount">'+list.length+'</span></div>' +
          '<div class="chips">'+chips+
            '<button class="add-slot" data-action="quick-add" data-group="'+g+'" data-level="'+l.code+'">+ ajouter</button>' +
          '</div></div>';
      }).join("");
      return '<div class="card"><div class="chead"><h2>Sixième '+g+'</h2><span class="total">'+groupTotal+' agents</span></div>' + levelsHtml + '</div>';
    }).join("");
  }

  function renderOut(){
    var out = state.members.filter(function(m){ return !m.active; });
    document.getElementById("outCount").textContent = out.length;
    var list = document.getElementById("outList");
    if (!out.length){
      list.innerHTML = '<span class="empty-note">Aucun personnel sorti pour le moment.</span>';
      return;
    }
    list.innerHTML = out.map(function(m){
      return '<span class="out-chip">'+escapeHtml(m.grade||"")+' '+escapeHtml(m.name)+
        ' <button data-action="reactivate" data-id="'+m.id+'">Réintégrer</button></span>';
    }).join("");
  }

  function renderHistoryFilterOptions(){
    var sel = document.getElementById("histFilter");
    var months = {};
    state.movements.forEach(function(mv){ if (mv.month) months[mv.month] = true; });
    var current = sel.value;
    var opts = ['<option value="">Tous</option>'].concat(
      Object.keys(months).sort().reverse().map(function(m){
        return '<option value="'+m+'">'+monthDisplay(m)+'</option>';
      })
    );
    sel.innerHTML = opts.join("");
    sel.value = current;
  }

  function renderHistory(){
    renderHistoryFilterOptions();
    var filter = document.getElementById("histFilter").value;
    var rows = state.movements
      .filter(function(mv){ return !filter || mv.month === filter; })
      .slice()
      .sort(function(a,b){ return (b.ts||"").localeCompare(a.ts||""); });

    var body = document.getElementById("histBody");
    if (!rows.length){
      body.innerHTML = '<tr><td colspan="5" class="empty-note">Aucun mouvement enregistré.</td></tr>';
      return;
    }
    body.innerHTML = rows.map(function(mv){
      var tagClass = mv.type === "ajout" ? "ajout" : mv.type === "sortie" ? "sortie" : mv.type === "retour" ? "retour" : "mutation";
      var tagLabel = mv.type === "ajout" ? "Ajout" : mv.type === "sortie" ? "Sortie" : mv.type === "retour" ? "Retour" : "Mutation";
      var detail = "";
      if (mv.type === "mutation"){
        detail = "Sixième "+mv.fromGroup+" · "+levelLabel(mv.fromLevel)+" → Sixième "+mv.toGroup+" · "+levelLabel(mv.toLevel);
      } else if (mv.type === "ajout"){
        detail = "Sixième "+mv.toGroup+" · "+levelLabel(mv.toLevel);
      } else if (mv.type === "sortie"){
        detail = "Sixième "+mv.fromGroup+" · "+levelLabel(mv.fromLevel);
      } else if (mv.type === "retour"){
        detail = "Sixième "+mv.toGroup+" · "+levelLabel(mv.toLevel);
      }
      return '<tr><td>'+monthDisplay(mv.month)+'</td><td><span class="tag '+tagClass+'">'+tagLabel+'</span></td>' +
        '<td>'+escapeHtml(mv.memberLabel||"")+'</td><td>'+escapeHtml(detail)+'</td><td>'+escapeHtml(mv.note||"")+'</td></tr>';
    }).join("");
  }

  function renderAll(){ renderStats(); renderBoard(); renderOut(); renderHistory(); }

  // ---------- modals ----------
  function closeModal(){ var ov = document.getElementById("overlay"); ov.hidden = true; ov.innerHTML = ""; }
  function openModal(html){ var ov = document.getElementById("overlay"); ov.innerHTML = '<div class="modal">'+html+'</div>'; ov.hidden = false; }

  function gradeOptions(selected){
    return GRADES.map(function(g){ return '<option value="'+g+'"'+(g===selected?" selected":"")+'>'+g+'</option>'; }).join("") +
      '<option value="__other__"'+(GRADES.indexOf(selected)===-1 && selected ? " selected":"")+'>Autre…</option>';
  }
  function groupOptions(selected){
    return GROUPS.map(function(g){ return '<option value="'+g+'"'+(String(g)===String(selected)?" selected":"")+'>Sixième '+g+'</option>'; }).join("");
  }
  function levelOptions(selected){
    return LEVELS.map(function(l){ return '<option value="'+l.code+'"'+(l.code===selected?" selected":"")+'>'+l.label+'</option>'; }).join("");
  }

  function openAddModal(prefillGroup, prefillLevel){
    openModal(
      '<h3>Ajouter du personnel</h3>' +
      '<div class="field"><label>Grade</label><select id="fGrade">'+gradeOptions()+'</select></div>' +
      '<div class="field" id="fGradeOtherWrap" hidden><label>Grade (préciser)</label><input id="fGradeOther" type="text"></div>' +
      '<div class="field"><label>Nom</label><input id="fName" type="text" placeholder="Ex. DUPONT"></div>' +
      '<div class="row2">' +
        '<div class="field"><label>Sixième</label><select id="fGroup">'+groupOptions(prefillGroup)+'</select></div>' +
        '<div class="field"><label>Niveau</label><select id="fLevel">'+levelOptions(prefillLevel)+'</select></div>' +
      '</div>' +
      '<div class="field"><label>Note (optionnel)</label><input id="fNote" type="text" placeholder="Ex. arrivée mutation Toulon"></div>' +
      '<div class="modal-actions"><button class="btn ghost" data-action="cancel">Annuler</button>' +
      '<button class="btn primary" data-action="save-add">Ajouter</button></div>'
    );
    document.getElementById("fGrade").addEventListener("change", function(){
      document.getElementById("fGradeOtherWrap").hidden = this.value !== "__other__";
    });
  }

  function openMemberModal(id){
    var m = state.members.find(function(x){ return x.id === id; });
    if (!m) return;
    openModal(
      '<h3>'+escapeHtml(m.grade||"")+' '+escapeHtml(m.name)+'</h3>' +
      '<p style="font-size:.82rem;color:var(--text-dim);margin:0;">Actuellement : Sixième '+m.group+' · '+levelLabel(m.level)+'</p>' +
      '<div class="row2">' +
        '<div class="field"><label>Nouveau sixième</label><select id="mGroup">'+groupOptions(m.group)+'</select></div>' +
        '<div class="field"><label>Nouveau niveau</label><select id="mLevel">'+levelOptions(m.level)+'</select></div>' +
      '</div>' +
      '<div class="field"><label>Note (optionnel)</label><input id="mNote" type="text" placeholder="Motif du mouvement"></div>' +
      '<div class="modal-actions">' +
        '<button class="btn danger" data-action="retire" data-id="'+id+'">Sortir du roulement</button>' +
        '<button class="btn ghost" data-action="cancel">Annuler</button>' +
        '<button class="btn primary" data-action="save-move" data-id="'+id+'">Enregistrer le mouvement</button>' +
      '</div>'
    );
  }

  function currentMonthValue(){
    var el = document.getElementById("currentMonth");
    return el.value || thisMonthStr();
  }

  // ---------- actions ----------
  function addMember(){
    var gradeSel = document.getElementById("fGrade").value;
    var grade = gradeSel === "__other__" ? document.getElementById("fGradeOther").value.trim() : gradeSel;
    var name = document.getElementById("fName").value.trim().toUpperCase();
    var group = parseInt(document.getElementById("fGroup").value, 10);
    var level = document.getElementById("fLevel").value;
    var note = document.getElementById("fNote").value.trim();
    if (!name){ toast("Merci d'indiquer un nom."); return; }

    api("members", { method:"POST", body: JSON.stringify({ grade:grade, name:name, group:group, level:level, note:note, month: currentMonthValue() }) })
      .then(function(){ toast("Personnel ajouté."); closeModal(); return refreshAll(); })
      .catch(function(err){ console.error(err); toast("Échec de l'ajout."); });
  }

  function saveMove(id){
    var m = state.members.find(function(x){ return x.id === id; });
    if (!m) return;
    var toGroup = parseInt(document.getElementById("mGroup").value, 10);
    var toLevel = document.getElementById("mLevel").value;
    var note = document.getElementById("mNote").value.trim();
    if (toGroup === m.group && toLevel === m.level){ toast("Aucun changement de position."); return; }

    api("members/"+id, { method:"PATCH", body: JSON.stringify({
      group: toGroup, level: toLevel,
      logMovement: { type:"mutation", month: currentMonthValue(), memberLabel:(m.grade?m.grade+" ":"")+m.name,
        fromGroup:m.group, fromLevel:m.level, toGroup:toGroup, toLevel:toLevel, note:note }
    })}).then(function(){ toast("Mouvement enregistré."); closeModal(); return refreshAll(); })
      .catch(function(err){ console.error(err); toast("Échec de l'enregistrement."); });
  }

  function retireMember(id){
    var m = state.members.find(function(x){ return x.id === id; });
    if (!m) return;
    api("members/"+id, { method:"PATCH", body: JSON.stringify({
      active:false,
      logMovement: { type:"sortie", month: currentMonthValue(), memberLabel:(m.grade?m.grade+" ":"")+m.name, fromGroup:m.group, fromLevel:m.level }
    })}).then(function(){ toast("Personnel sorti du roulement."); closeModal(); return refreshAll(); })
      .catch(function(err){ console.error(err); toast("Échec de l'opération."); });
  }

  function reactivateMember(id){
    var m = state.members.find(function(x){ return x.id === id; });
    if (!m) return;
    api("members/"+id, { method:"PATCH", body: JSON.stringify({
      active:true,
      logMovement: { type:"retour", month: currentMonthValue(), memberLabel:(m.grade?m.grade+" ":"")+m.name, toGroup:m.group, toLevel:m.level }
    })}).then(function(){ toast("Personnel réintégré."); return refreshAll(); })
      .catch(function(err){ console.error(err); toast("Échec de l'opération."); });
  }

  function exportCsv(){
    var lines = ["Sixieme;Niveau;Grade;Nom;Statut"];
    state.members.slice().sort(function(a,b){
      return a.group - b.group || a.level.localeCompare(b.level) || (a.name||"").localeCompare(b.name||"");
    }).forEach(function(m){
      lines.push([m.group, levelLabel(m.level), m.grade||"", m.name, m.active?"Actif":"Sorti"].join(";"));
    });
    var csv = "﻿" + lines.join("\n");
    var blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "effectifs-bmpm-"+currentMonthValue()+".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    toast("Fichier téléchargé.");
  }

  // ---------- events ----------
  document.addEventListener("click", function(e){
    var t = e.target;
    if (t.id === "btnAdd"){ openAddModal(); }
    else if (t.id === "btnExport"){ exportCsv(); }
    else if (t.id === "btnHistoryToggle"){
      var p = document.getElementById("historyPanel");
      p.hidden = !p.hidden;
      if (!p.hidden) renderHistory();
    }
    else if (t.dataset && t.dataset.action === "quick-add"){ openAddModal(t.dataset.group, t.dataset.level); }
    else if (t.dataset && t.dataset.action === "open-member"){ openMemberModal(t.dataset.id); }
    else if (t.dataset && t.dataset.action === "cancel"){ closeModal(); }
    else if (t.dataset && t.dataset.action === "save-add"){ addMember(); }
    else if (t.dataset && t.dataset.action === "save-move"){ saveMove(t.dataset.id); }
    else if (t.dataset && t.dataset.action === "retire"){ retireMember(t.dataset.id); }
    else if (t.dataset && t.dataset.action === "reactivate"){ reactivateMember(t.dataset.id); }
    else if (t.id === "overlay"){ closeModal(); }
  });
  document.addEventListener("change", function(e){ if (e.target.id === "histFilter"){ renderHistory(); } });

  document.getElementById("currentMonth").value = thisMonthStr();

  // ---------- boot ----------
  refreshAll().catch(function(err){
    console.error(err);
    setStatus("Impossible de joindre le serveur — vérifie ta connexion.");
  });
  setInterval(function(){ refreshAll().catch(function(){}); }, 20000);

  if ("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>
</body>
</html>
